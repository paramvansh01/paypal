<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Halcyon Crumb Bakery</title>
<meta name="description" content="Halcyon Crumb is a small neighbourhood bakery (a fictional demo site for Kept).">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html">Halcyon Crumb</a>
    <nav aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="hero"><h1>Get in touch</h1><p>Cake orders, wholesale, or just to say hello. We reply within a day.</p></section>
  <form class="contact" id="contact-form" novalidate>
    <label>Your name <input id="name" name="name" autocomplete="name" required></label>
    <label>Email <input id="email" name="email" type="email" autocomplete="email" required></label>
    <label>Message <textarea id="message" name="message" rows="5" required></textarea></label>
    <button class="button" type="submit">Send message</button>
    <div id="form-status" role="status" aria-live="polite"></div>
  </form>
</main>
<script src="app.js"></script>
<footer class="site">
  <div class="wrap">Halcyon Crumb Bakery · 14 Orchard Row · Open Tue–Sun, 7am–2pm<br>A fictional business made for the Kept demo.</div>
</footer>
</body>
</html>
